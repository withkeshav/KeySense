server {
    listen 80;
    server_name example.invalid;
    root /var/www/keysense-public; # Reviewed release files only, never a checkout.
    index index.html;

    # Example for an origin behind an HTTPS proxy. Configure TLS separately
    # if this server is exposed directly.
    location ~ /\. {
        deny all;
    }

    # Cache policy. This app has no build step and no hashed asset names, so a
    # cached script can be paired with a fresh index.html and the browser runs
    # old code against new markup. Measured before this policy existed:
    # /src/learn-visuals.js came back "cf-cache-status: HIT, age 418" while
    # /index.html came back DYNAMIC, and a deploy looked live while the page
    # was still executing the previous version.
    #
    # So: things whose name changes with the content are cached hard; things
    # whose name never changes are revalidated on every load. Revalidation is a
    # cheap 304, and it makes a deploy visible immediately.

    # The page itself, always revalidated.
    location = /index.html {
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "no-cache" always;
    }

    # Vendored libraries, where the filename carries the exact version
    # (ethers-5.8.0, qrcode-1.5.1, tweetnacl-1.0.3). These can never go stale
    # without the name changing, so they are cached for a year.
    location ~* ^/src/vendor/ {
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # The app's own javascript and css. The names do not change, so they must
    # be revalidated rather than cached blind.
    location ~* ^/src/.*\.(js|css)$ {
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "no-cache" always;
    }

    # Documentation and the machine-readable gates output. Read, not run, so a
    # short cache is fine and keeps the origin quieter.
    location ~* \.(md|txt|json)$ {
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "public, max-age=300" always;
    }

    location / {
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri $uri/ =404;
    }
}
