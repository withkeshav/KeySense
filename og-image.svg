<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a0b"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Grid dots pattern -->
  <g opacity="0.06">
    <pattern id="dots" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1.5" fill="#fff"/>
    </pattern>
    <rect width="1200" height="630" fill="url(#dots)"/>
  </g>

  <!-- Accent line -->
  <rect x="0" y="0" width="6" height="630" fill="url(#accentGrad)"/>

  <!-- Logo / Brand -->
  <text x="80" y="180" font-family="system-ui, -apple-system, sans-serif" font-size="88" font-weight="700" letter-spacing="-2" fill="#f4f4f5">
    <tspan fill="#3b82f6">Key</tspan>Sense
  </text>

  <text x="80" y="250" font-family="system-ui, -apple-system, sans-serif" font-size="28" fill="#a1a1aa" font-weight="400">
    Web3 Key, Path and Security Workbench
  </text>

  <!-- Key features -->
  <g transform="translate(80, 350)">
    <rect x="0" y="0" width="340" height="72" rx="10" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <text x="24" y="34" font-family="system-ui, sans-serif" font-size="15" fill="#3b82f6" font-weight="600">BIP39/32/44/49/84/86</text>
    <text x="24" y="56" font-family="system-ui, sans-serif" font-size="13" fill="#71717a">Multi-chain HD derivation</text>
  </g>

  <g transform="translate(440, 350)">
    <rect x="0" y="0" width="340" height="72" rx="10" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <text x="24" y="34" font-family="system-ui, sans-serif" font-size="15" fill="#3b82f6" font-weight="600">Vanity + Brain Wallet</text>
    <text x="24" y="56" font-family="system-ui, sans-serif" font-size="13" fill="#71717a">Offline mining and entropy lab</text>
  </g>

  <g transform="translate(800, 350)">
    <rect x="0" y="0" width="320" height="72" rx="10" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <text x="24" y="34" font-family="system-ui, sans-serif" font-size="15" fill="#3b82f6" font-weight="600">100% Offline</text>
    <text x="24" y="56" font-family="system-ui, sans-serif" font-size="13" fill="#71717a">No server needed, file:// ready</text>
  </g>

  <!-- Chains -->
  <text x="80" y="490" font-family="system-ui, sans-serif" font-size="16" fill="#52525b" font-weight="500">
    Ethereum  ·  Bitcoin  ·  Solana  ·  Tron  ·  Litecoin  ·  Dogecoin
  </text>

  <!-- Footer -->
  <text x="80" y="570" font-family="system-ui, sans-serif" font-size="14" fill="#52525b">
    github.com/withkeshav/KeySense
  </text>

  <!-- Lock icon (simple) -->
  <g transform="translate(1060, 480)" opacity="0.3">
    <rect x="10" y="20" width="24" height="20" rx="3" fill="none" stroke="#fff" stroke-width="2"/>
    <path d="M14,20 L14,14 C14,10 18,8 22,8 C26,8 30,10 30,14 L30,20" fill="none" stroke="#fff" stroke-width="2"/>
  </g>
</svg>
